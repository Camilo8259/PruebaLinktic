services:
  db:
    image: mysql:8.0
    container_name: comercio
    restart: always
    environment:
      - MYSQL_DATABASE=comercio
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password123
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  ms_products:
    image: camiloa82/ms_products:1.0
    container_name: ms_products
    ports:
      - "8001:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/comercio?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - SERVER_PORT=8080
    depends_on:
      db:
        condition: service_healthy

  ms_inventory:
    image: camiloa82/ms_inventory:1.0
    container_name: ms_inventory
    ports:
      - "8002:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/comercio?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - SERVER_PORT=8080
      - PRODUCTS_SERVICE_URL=http://ms_products:8080
    depends_on:
      db:
        condition: service_healthy
      ms_products:
        condition: service_started

volumes:
  mysql_data: